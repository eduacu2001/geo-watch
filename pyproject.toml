[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geowatch"
version = "0.1.0"
description = "Detecting manoeuvres and proximity operations of GEO satellites from public orbital data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eduardo Acuña" }]
dependencies = [
    "spacetrack>=2.0",
    "sgp4>=2.23",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
